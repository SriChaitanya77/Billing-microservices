server:
  port: 8081
spring:
  application:
    name: AUTH-SERVICE
		spring:
		  datasource:
		    username: ${DB_USERNAME}
		    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
jwt:
  secret: ${JWT_SECRET:PS024-PrecisionAutoCare-Secret-Key-Change-Me-2026-Long}
  expiration-ms: 86400000
management:
  endpoints:
    web:
      exposure:
        include: health,info
