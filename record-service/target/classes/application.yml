server:
  port: 8083
spring:
  application:
    name: RECORD-SERVICE
  datasource:
		spring:
		  datasource:
		    username: ${DB_USERNAME}
		    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
jwt:
  secret: ${JWT_SECRET:PS024-PrecisionAutoCare-Secret-Key-Change-Me-2026-Long}
management:
  endpoints:
    web:
      exposure:
        include: health,info
