server:
  port: 8080
spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates: [Path=/api/auth/**]
        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates: [Path=/api/bookings/**]
        - id: record-service
          uri: lb://RECORD-SERVICE
          predicates: [Path=/api/records/**]
        - id: billing-service
          uri: lb://BILLING-SERVICE
          predicates: [Path=/api/billing/**]
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
